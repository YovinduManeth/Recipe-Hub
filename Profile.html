<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Recipe Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav class="navbar navbar-expand-lg bg-white border rounded">

    <div class="container-fluid">

        <a class="navbar-brand d-flex align-items-center" href="home.html">

            <img src="Images/Logo/Recipe_Hub_logo.png"
            width="40"
            height="40"
            class="me-2">

            <span>Recipe Hub</span>

        </a>

        <button class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
        id="navbarMenu">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="home.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="recipes.html">
                        Recipes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="favourites.html">
                        Favourites
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact Us
                    </a>
                </li>

            </ul>

            <i class="fa-solid fa-user user-icon"></i>

            <i class="fa-solid fa-moon mode-icon"></i>

        </div>

    </div>

</nav>

</header>

<section class="register-section">

<div class="register-card">

    <i class="fa-solid fa-circle-user profile-avatar"></i>

    <h1>My Profile</h1>

    <p>
        Manage your Recipe Hub account information.
    </p>

    <form id="profileForm">

        <!-- Username -->

        <div class="register-input">

            <i class="fa-solid fa-user"></i>

            <input
            type="text"
            id="profileUsername"
            placeholder="Username">

        </div>


        <!-- Email -->

        <div class="register-input">

            <i class="fa-solid fa-envelope"></i>

            <input
            type="email"
            id="profileEmail"
            placeholder="Email">

        </div>


        <!-- New Password -->

        <div class="register-input">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="newPassword"
            placeholder="New Password (Optional)">

        </div>


        <!-- Confirm Password -->

        <div class="register-input">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="confirmNewPassword"
            placeholder="Confirm Password">

        </div>


        <!-- Save -->

        <button type="submit">

            <i class="fa-solid fa-floppy-disk"></i>

            Save Changes

        </button>


        <br><br>


        <a href="home.html"
        class="btn btn-secondary w-100">

            <i class="fa-solid fa-house"></i>

            Back to Home

        </a>

    </form>

</div>

</section>



<footer>

© 2026 Recipe Hub. All Rights Reserved.

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/recipeData.js"></script>
<script src="js/script.js"></script>

</body>

</html>
